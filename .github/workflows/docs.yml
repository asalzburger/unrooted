name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.5"
          python-version: "3.11"

      - name: Install docs dependencies
        run: uv sync --locked --group docs --extra plotly

      - name: Deploy to GitHub Pages
        run: uv run --no-sync mkdocs gh-deploy --strict --force

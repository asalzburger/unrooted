[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unrooted"
dynamic = ["version"]
description = "Load, represent, and plot physics histograms and point clouds without ROOT."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andreas Salzburger"}]
maintainers = [{name = "Andreas Salzburger"}]
keywords = ["ROOT", "histogram", "HEP", "plotting", "scatter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "uproot>=5.6.0",
    "awkward>=2.8.0",
    "matplotlib>=3.8.4",
    "boost-histogram>=1.7.2",
]

[project.scripts]
unrooted = "unrooted.cli.main:main"

[project.urls]
Homepage = "https://asalzburger.github.io/unrooted"
Repository = "https://github.com/asalzburger/unrooted"
Documentation = "https://asalzburger.github.io/unrooted"
Issues = "https://github.com/asalzburger/unrooted/issues"
Changelog = "https://github.com/asalzburger/unrooted/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plotly = [
    "plotly>=5.24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["unrooted"]

[tool.hatch.version]
path = "unrooted/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/unrooted", "/LICENSE", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
include = ["unrooted"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
filterwarnings = [
    "error:More than 20 figures have been opened:RuntimeWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "pyright>=1.1.400",
    "hatchling>=1.27",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    {include-group = "dev"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unrooted"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "uproot>=5.6.0",
    "awkward>=2.8.0",
    "matplotlib>=3.8.4",
    "boost-histogram>=1.7.2",
]

[project.scripts]
unrooted = "unrooted.cli.main:main"

[project.urls]
Homepage = "https://asalzburger.github.io/unrooted"
Repository = "https://github.com/asalzburger/unrooted"
Documentation = "https://asalzburger.github.io/unrooted"

[project.optional-dependencies]
plotly = [
    "plotly>=5.24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["unrooted"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
include = ["unrooted"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
filterwarnings = [
    "error:More than 20 figures have been opened:RuntimeWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "pyright>=1.1.400",
    "hatchling>=1.27",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    {include-group = "dev"},
]
